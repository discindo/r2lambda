name: Build pkgdown site

# Builds once, in release mode: release-please versions never carry a
# .9000 suffix, so a separate dev site would only duplicate this one.
# No paths-ignore: README.md and NEWS.md are the home and news pages.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # extra-repositories: https://example.org/R  # e.g. for non-CRAN Suggests

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
        env:
          PKGDOWN_DEV_MODE: release

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs/"

  deploy:
    runs-on: ubuntu-latest
    needs: pkgdown
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
