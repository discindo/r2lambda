# Derived from https://github.com/amannn/action-semantic-pull-request
# The PR title becomes the squash commit subject that release-please reads.

name: PR title

on:
  # Safe with pull_request_target: the PR code is never checked out.
  pull_request_target:
    types:
      - opened
      - reopened
      - edited

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
