name: R CMD Check

on:
  # Keeps the README badge on the status of main.
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*.md"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - "codecov.yml"
      - "_pkgdown.yml"
      - "pkgdown/**"
      - "CITATION.cff"
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  air:
    name: air format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install
        uses: posit-dev/setup-air@v1

      - name: Check
        run: air format . --check

  jarl:
    name: jarl check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs `jarl check` by default.
      - uses: etiennebacher/setup-jarl@v0.1.1

  R-CMD-check:
    needs: [air, jarl]
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest, r: "release" }
          - { os: windows-latest, r: "release" }
          - { os: ubuntu-latest, r: "devel", http-user-agent: "release" }
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }
        # R-devel has no binary packages, so that job compiles every
        # dependency. Run it weekly and on demand, not on PRs or pushes.
        exclude: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && fromJSON('[{"config":{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"}}]') || fromJSON('[]') }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          # extra-repositories: https://example.org/R  # e.g. for non-CRAN Suggests

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'
          upload-snapshots: true
