{
  "R": {
    "Version": "4.6.1",
    "Repositories": [
      {
        "Name": "CRAN",
        "URL": "https://cloud.r-project.org"
      }
    ]
  },
  "Packages": {
    "R6": {
      "Package": "R6",
      "Version": "2.6.1",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": [
        "R"
      ]
    },
    "askpass": {
      "Package": "askpass",
      "Version": "1.2.1",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": [
        "sys"
      ]
    },
    "curl": {
      "Package": "curl",
      "Version": "8.0.0",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": [
        "R"
      ]
    },
    "httr": {
      "Package": "httr",
      "Version": "1.4.9",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": [
        "R",
        "R6",
        "curl",
        "jsonlite",
        "mime",
        "openssl"
      ]
    },
    "jsonlite": {
      "Package": "jsonlite",
      "Version": "2.0.0",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": [
        "methods"
      ]
    },
    "lambdr": {
      "Package": "lambdr",
      "Version": "1.2.5",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": [
        "httr",
        "jsonlite",
        "logger"
      ]
    },
    "logger": {
      "Package": "logger",
      "Version": "0.4.3",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": [
        "utils"
      ]
    },
    "mime": {
      "Package": "mime",
      "Version": "0.13",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": [
        "tools"
      ]
    },
    "openssl": {
      "Package": "openssl",
      "Version": "2.4.2",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": [
        "askpass"
      ]
    },
    "renv": {
      "Package": "renv",
      "Version": "1.3.1",
      "Source": "Repository",
      "Repository": "CRAN",
      "Requirements": [
        "utils"
      ]
    },
    "sys": {
      "Package": "sys",
      "Version": "3.4.3",
      "Source": "Repository",
      "Repository": "CRAN"
    }
  }
}
